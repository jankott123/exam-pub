services:
  mysql:
    image: mysql:8.0
    container_name: exam-pub-mysql
    environment:
      MYSQL_DATABASE: exam_pub
      MYSQL_USER: pub
      MYSQL_PASSWORD: pub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: exam-pub-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/exam_pub
      DB_USERNAME: pub
      DB_PASSWORD: pub
    ports:
      - "8080:8080"

volumes:
  mysql-data: