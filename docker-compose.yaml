services:
  mysql:
    image: mysql:8.0
    container_name: exam-pub-mysql
    environment:
      MYSQL_DATABASE: exam_pub
      MYSQL_USER: pub
      MYSQL_PASSWORD: pub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: